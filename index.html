<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Video Player</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/ffmpeg/ffmpeg.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 WASM Video Player</h1>
            <p class="subtitle">MKV · HEVC · AVI · MOV · WebM · MP4</p>
            <div id="status-bar" class="status loading">Проверка файлов...</div>
        </header>

        <div id="diag-panel" class="panel" style="display:none;">
            <h3>🔍 Диагностика</h3>
            <div id="diag-content"></div>
        </div>

        <div id="drop-zone" class="drop-zone">
            <p>📁 Перетащите видео сюда или <span class="link">выберите файл</span></p>
            <p class="hint">MP4, MKV, AVI, MOV, WebM, TS, FLV</p>
            <input type="file" id="file-input" accept="video/*" hidden>
        </div>

        <div class="player-wrapper">
            <video id="video-player" controls preload="metadata" style="display:none;"></video>
            <div id="placeholder" class="placeholder">
                <p>Нет загруженного видео</p>
            </div>
        </div>

        <div id="stats-panel" class="panel" style="display:none;">
            <h3>📊 Nerd Stats</h3>
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <div id="ffmpeg-panel" class="panel" style="display:none;">
            <h3>⚙️ FFmpeg WASM</h3>
            <div class="btn-group">
                <button id="btn-transcode" disabled>🔄 Транскод в MP4</button>
                <button id="btn-thumbs" disabled>🖼 Скриншоты</button>
                <button id="btn-gif" disabled>🎞 GIF</button>
                <button id="btn-info" disabled>📋 Инфо</button>
            </div>
            <div id="progress" class="progress" style="display:none;">
                <div class="progress-bar"><div id="progress-fill"></div></div>
                <span id="progress-text">0%</span>
            </div>
            <div id="log-output" class="log"></div>
        </div>

        <div id="result-panel" class="panel" style="display:none;">
            <h3>📤 Результат</h3>
            <div id="result-content"></div>
        </div>

        <div id="thumbs-panel" class="panel" style="display:none;">
            <h3>🖼 Скриншоты</h3>
            <div id="thumbs-grid" class="thumbs-grid"></div>
        </div>

        <footer>
            <p>Вдохновлено <a href="https://github.com/mrujjwalg/movi-player" target="_blank">movi-player</a></p>
        </footer>
    </div>
    <script src="./js/app.js"></script>
</body>
</html>
